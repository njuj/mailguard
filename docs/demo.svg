elay:1.80s" x="24" y="271" fill="#ffd166">   ⚠ DMARC policy     quarantine (spoofed mail goes to spam, not rejected)  -5</text><text class="l" style="animation-delay:1.86s" x="24" y="290" fill="#00ff9c">   ✔ DMARC reporting  aggregate reports (rua) configured</text><text class="l" style="animation-delay:1.92s" x="24" y="309" fill="#ffd166">   ⚠ DKIM             1024-bit RSA key at selector1, k1, the minimum allowed; rotate to 2048 (6 live keys)  -3</text><text class="l" style="animation-delay:1.98s" x="24" y="328" fill="#c9d1d9">   · MTA-STS          no MTA-STS record; inbound mail can be downgraded to cleartext</text><text class="l" style="animation-delay:2.04s" x="24" y="347"><tspan fill="#00ff9c" font-weight="700">kira@lab</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#00e5ff">~</tspan><tspan fill="#c9d1d9">$ </tspan><tspan class="cur" fill="#00ff9c">█</tspan></text></svg>