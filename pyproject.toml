[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailguard"
dynamic = ["version"]
description = "Grade a domain's email anti-spoofing posture (SPF, DKIM, DMARC, MTA-STS) from DNS alone. Catches the silent SPF 10-lookup permerror."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["security", "email", "spf", "dkim", "dmarc", "mta-sts", "anti-spoofing", "dns", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/mailguard"

[project.scripts]
mailguard = "mailguard.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mailguard.__version__" }

[tool.setuptools.packages.find]
include = ["mailguard*"]

